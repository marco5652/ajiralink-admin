<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Post New Job — AjiraLink Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" />
<link rel="stylesheet" href="css/brand.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div class="app" id="app">

  <div class="page-header">
    <div class="row">
      <button class="back-btn" aria-label="Back" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div>
        <h2>Post New Job</h2>
      </div>
    </div>
  </div>

  <div class="scroll-area">
    <div class="form-body">
      <div class="form-group">
        <label for="p-title">Job Title</label>
        <input type="text" id="p-title" placeholder="e.g. Software Developer" />
      </div>

      <div class="form-group">
        <label for="p-company">Company</label>
        <input type="text" id="p-company" placeholder="e.g. TechCo Tanzania Ltd" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="p-location">Location</label>
          <select id="p-location"><option value="">Loading...</option></select>
        </div>
        <div class="form-group">
          <label for="p-category">Category</label>
          <select id="p-category"><option value="">Loading...</option></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="p-type">Job Type</label>
          <select id="p-type"><option value="">Loading...</option></select>
        </div>
        <div class="form-group">
          <label for="p-worktype">Work Type</label>
          <select id="p-worktype"><option value="">Loading...</option></select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="p-positions">Positions</label>
          <input type="number" id="p-positions" min="1" step="1" placeholder="e.g. 1" />
        </div>
        <div class="form-group">
          <label for="p-salary">Salary</label>
          <input type="text" id="p-salary" placeholder="e.g. TZS 1,500,000 / month" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="p-deadline">Deadline</label>
          <input type="date" id="p-deadline" />
        </div>
        <div class="form-group">
          <label for="p-posted">Posted Date</label>
          <input type="date" id="p-posted" />
        </div>
      </div>

      <div class="form-group">
        <label for="p-source">Source</label>
        <select id="p-source"><option value="">Loading...</option></select>
      </div>

      <div class="form-group">
        <label for="p-apply-url">Application URL</label>
        <input type="url" id="p-apply-url" placeholder="https://example.com/apply" />
      </div>

      <div class="form-group">
        <label>Job Content</label>
        <div class="quill-editor-wrap">
          <div id="p-content-editor"></div>
        </div>
      </div>

      <button class="btn-preview-post" id="previewBtn">
        <i class="fas fa-eye"></i> Preview
      </button>

      <button class="btn-submit-post" id="submitBtn">
        <i class="fas fa-paper-plane"></i> Post Job
      </button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/lookups.js"></script>
<script src="js/job-form.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    initJobForm({ mode: 'create' });
  });
</script>
</body>
</html>
