<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Login — AjiraLink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="css/brand.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div class="app" id="app">

  <div class="auth-page">
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <i class="fas fa-briefcase"></i>
        </div>
        <div class="auth-logo-text">Ajira<span>Link</span></div>
      </div>

      <div class="auth-title">Welcome Back</div>
      <div class="auth-subtitle">Sign in to your admin account to continue</div>

      <div class="auth-form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="auth-form-group">
        <label for="login-password">Password</label>
        <div class="password-wrap">
          <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="password-toggle" aria-label="Show password"
                  onclick="togglePassword('login-password', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button class="auth-btn-primary" id="loginBtn">Login</button>

      <div class="auth-switch">
        Don't have an account?
        <a href="register.html">Register here</a>
      </div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/login.js"></script>
</body>
</html>
