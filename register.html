<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Admin Register — AjiraLink</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="css/brand.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div class="app" id="app">

  <div class="auth-page">
    <div class="auth-inner">
      <div class="auth-logo">
        <div class="auth-logo-icon">
          <i class="fas fa-briefcase"></i>
        </div>
        <div class="auth-logo-text">Ajira<span>Link</span></div>
      </div>

      <div class="auth-title">Create Account</div>
      <div class="auth-subtitle">Register to start posting jobs</div>

      <div class="auth-form-group">
        <label for="reg-name">Full Name</label>
        <input type="text" id="reg-name" placeholder="e.g. John Doe" autocomplete="name" />
      </div>

      <div class="auth-form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="auth-form-group">
        <label for="reg-password">Password</label>
        <div class="password-wrap">
          <input type="password" id="reg-password" placeholder="••••••••" autocomplete="new-password" />
          <button type="button" class="password-toggle" aria-label="Show password"
                  onclick="togglePassword('reg-password', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="auth-form-group">
        <label for="reg-confirm">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="reg-confirm" placeholder="••••••••" autocomplete="new-password" />
          <button type="button" class="password-toggle" aria-label="Show password"
                  onclick="togglePassword('reg-confirm', this)">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <button class="auth-btn-primary" id="registerBtn">Register</button>

      <div class="auth-switch">
        Already have an account?
        <a href="login.html">Login here</a>
      </div>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/register.js"></script>
</body>
</html>
