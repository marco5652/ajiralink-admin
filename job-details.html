<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Job Details — AjiraLink Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
<link rel="stylesheet" href="css/brand.css" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

<div class="app" id="app">

  <div class="page-header">
    <div class="row">
      <button class="back-btn" aria-label="Back" onclick="window.location.href='index.html'">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div>
        <h2>Job Details</h2>
      </div>
    </div>
  </div>

  <div class="scroll-area">
    <div class="details-body" id="details-body-content"></div>

    <div class="detail-actions-bar" id="actions-bar" style="display:none;">
      <button class="btn-edit" id="editBtn">
        <i class="fas fa-edit"></i> Edit
      </button>
      <button class="btn-delete" id="deleteBtn">
        <i class="fas fa-trash"></i> Delete
      </button>
    </div>
  </div>

</div>

<script src="js/api.js"></script>
<script src="js/layout.js"></script>
<script src="js/auth.js"></script>
<script src="js/job-details.js"></script>
</body>
</html>
